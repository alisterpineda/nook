name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With no version given, this installs the SDK that global.json names.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      # setup-dotnet's own cache needs NuGet lock files, which this repo does not have.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'tests/Directory.Build.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Nook.Web/package-lock.json

      - name: Test the API
        run: dotnet test

      - name: Install the web app's packages
        working-directory: src/Nook.Web
        run: npm ci

      - name: Generate the web app's API types
        working-directory: src/Nook.Web
        run: npm run generate:api

      - name: Test the web app
        working-directory: src/Nook.Web
        run: npm test -- --watch=false

      - name: Lint the web app
        working-directory: src/Nook.Web
        run: npm run lint

      - name: Check the web app's formatting
        working-directory: src/Nook.Web
        run: npm run format:check

  # Publishes the container image. A run on main publishes it under the commit's SHA, and under main when
  # the commit is still the head of main. A run on a tag vX.Y.Z is a release: it builds the image with
  # version X.Y.Z and publishes it under X.Y.Z, X.Y, X and latest. A pull request publishes nothing, and
  # neither does a manual run on another branch. docs/releasing.md says how a release is made.
  image:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The whole history and every tag are fetched: a release is checked against main and against the
      # other version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Run before anything is built, so a tag that cannot be a release stops the run here. On a tag run
      # the version reaches both publishes below through the environment, where MSBuild reads
      # NookReleaseVersion as a property. The tags are not kept from this call: they are chosen again just
      # before the publish.
      - name: Work out the version
        id: version
        run: |
          facts="$(.github/scripts/image-tags.sh)"
          version="$(printf '%s\n' "$facts" | sed -n 's/^version=//p')"
          release="$(printf '%s\n' "$facts" | sed -n 's/^release=//p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ -n "$release" ]; then
            echo "NookReleaseVersion=$release" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'tests/Directory.Build.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Nook.Web/package-lock.json

      # The web app is built once here. The publishes below reuse it with SkipWebAppBuild, because the
      # publish for two architectures runs once per architecture at the same time, and two npm runs in one
      # folder would collide.
      - name: Build the web app
        working-directory: src/Nook.Web
        run: |
          npm ci
          npm run build

      # Both publishes turn off writing openapi.json: the file is committed, the web app is already built
      # from it, and the per-architecture builds would otherwise each write it at the same time.
      - name: Build the amd64 image into the runner's Docker
        run: >
          dotnet publish src/Nook.Api/Nook.Api.csproj -t:PublishContainer
          -p:SkipWebAppBuild=true
          -p:OpenApiGenerateDocumentsOnBuild=false
          -p:ContainerRepository=nook
          -p:ContainerImageTag=smoke

      # The image logs its version when it starts, and the smoke test reads it there, so a release is only
      # published once its image is seen to carry the tag's version.
      - name: Smoke test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/smoke-test.sh nook:smoke "$VERSION"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version's image is never pushed twice, so a release whose version the registry already holds
      # stops here.
      - name: Check that the release is not published yet
        if: github.ref_type == 'tag'
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: .github/scripts/image-tags.sh --check-unpublished "ghcr.io/alisterpineda/nook:$RELEASE"

      # The tags are chosen here, just before the publish, because main or the version tags may have moved
      # while this run built. A run on main moves the main tag only while its commit is still the head of
      # main, and a release is refused when a higher version was tagged in the meantime, so the tags are
      # fetched again first. The image's tags must not reach the environment any earlier: the smoke build
      # above passes ContainerImageTag, and the SDK refuses a build that is given both that and
      # ContainerImageTags.
      - name: Choose the image's tags
        run: |
          git fetch --quiet --tags origin
          facts="$(.github/scripts/image-tags.sh)"
          tags="$(printf '%s\n' "$facts" | sed -n 's/^tags=//p')"
          if [ -z "$tags" ]; then
            echo "The run has no tags to publish under." >&2
            exit 1
          fi
          echo "ContainerImageTags=$tags" >> "$GITHUB_ENV"

      - name: Publish the amd64 and arm64 image
        run: >
          dotnet publish src/Nook.Api/Nook.Api.csproj -t:PublishContainer
          -p:SkipWebAppBuild=true
          -p:OpenApiGenerateDocumentsOnBuild=false
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=alisterpineda/nook
          -p:RuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
