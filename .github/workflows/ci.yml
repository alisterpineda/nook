name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With no version given, this installs the SDK that global.json names.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      # setup-dotnet's own cache needs NuGet lock files, which this repo does not have.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'tests/Directory.Build.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Nook.Web/package-lock.json

      - name: Test the API
        run: dotnet test

      - name: Install the web app's packages
        working-directory: src/Nook.Web
        run: npm ci

      - name: Generate the web app's API types
        working-directory: src/Nook.Web
        run: npm run generate:api

      - name: Test the web app
        working-directory: src/Nook.Web
        run: npm test -- --watch=false

      - name: Lint the web app
        working-directory: src/Nook.Web
        run: npm run lint

      - name: Check the web app's formatting
        working-directory: src/Nook.Web
        run: npm run format:check

  # Publishes the container image. A pull request publishes nothing, and neither does a manual run on a
  # branch other than main, so only main can move the latest tag.
  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'tests/Directory.Build.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Nook.Web/package-lock.json

      # The web app is built once here. The publishes below reuse it with SkipWebAppBuild, because the
      # publish for two architectures runs once per architecture at the same time, and two npm runs in one
      # folder would collide.
      - name: Build the web app
        working-directory: src/Nook.Web
        run: |
          npm ci
          npm run build

      # Both publishes turn off writing openapi.json: the file is committed, the web app is already built
      # from it, and the per-architecture builds would otherwise each write it at the same time.
      - name: Build the amd64 image into the runner's Docker
        run: >
          dotnet publish src/Nook.Api/Nook.Api.csproj -t:PublishContainer
          -p:SkipWebAppBuild=true
          -p:OpenApiGenerateDocumentsOnBuild=false
          -p:ContainerRepository=nook
          -p:ContainerImageTag=smoke

      - name: Smoke test the image
        run: .github/scripts/smoke-test.sh nook:smoke

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every commit gets an image under its own SHA. Only the commit that is still the head of main also
      # moves latest, so a run that finishes late, or an old run started again, never puts latest back on
      # an older commit. Nook migrates the database when it starts, and older code must not meet a newer one.
      - name: Choose the image's tags
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$head" ]; then
            echo "Could not read the head of main." >&2
            exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "ContainerImageTags=latest;$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "main is now at $head, so this run leaves latest alone."
            echo "ContainerImageTags=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - name: Publish the amd64 and arm64 image
        run: >
          dotnet publish src/Nook.Api/Nook.Api.csproj -t:PublishContainer
          -p:SkipWebAppBuild=true
          -p:OpenApiGenerateDocumentsOnBuild=false
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=alisterpineda/nook
          -p:RuntimeIdentifiers='"linux-x64;linux-arm64"'
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"'
