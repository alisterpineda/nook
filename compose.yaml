# Runs Nook and its database. The README's "Installing" section says how to use this file.

services:
  nook:
    image: ${NOOK_IMAGE:-ghcr.io/alisterpineda/nook:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__nookdb: Host=postgres;Database=nook;Username=nook;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_DB: nook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: {}
