# Runs Nook and its database. The README's "Installing" section says how to use this file.

services:
  nook:
    image: ${NOOK_IMAGE:-ghcr.io/alisterpineda/nook:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # To keep the library somewhere else, such as on a larger disk, mount that folder over the library's place.
      # Like ./data, it must belong to the user with the id 1654. The README's "Storage" section says more.
      # - /mnt/books:/data/library
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # To keep the cache out of ./data, give it a folder inside the container. It is made again when it is lost.
      # Nook__CachePath: /tmp/nook-cache
      ConnectionStrings__nookdb: Host=postgres;Database=nook;Username=nook;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_DB: nook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: {}
